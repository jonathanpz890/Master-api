services:
  gateway:
    build: .
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      CORS_ORIGINS: http://localhost:3000
      PRINT3D_HUB_API_URL: http://print3d-hub:5001
      BYNDER_API_URL: http://bynder:5002
      BANGO_API_URL: http://bango:5003
    ports:
      - '3000:3000'
    init: true
    restart: unless-stopped

  print3d-hub:
    build: ./projects/print3d-hub
    env_file:
      - ./projects/print3d-hub/.env
    environment:
      PORT: 5001
      MONGODB_CONNECTION_URI: mongodb://mongo-print3d-hub:27017/print3d-hub
    ports:
      - '5001:5001'
    depends_on:
      mongo-print3d-hub:
        condition: service_started
    restart: unless-stopped

  mongo-print3d-hub:
    image: mongo:8
    volumes:
      - print3d-hub-mongo-data:/data/db
    restart: unless-stopped

  bynder:
    build: ./projects/bynder
    env_file:
      - ./projects/bynder/.env
    environment:
      PORT: 5002
      MONGO_URI: mongodb://mongo-bynder:27017/bynder
      SERVER_URL: http://localhost:5002
    ports:
      - '5002:5002'
    volumes:
      - bynder-images:/app/images
    depends_on:
      mongo-bynder:
        condition: service_started
    restart: unless-stopped

  mongo-bynder:
    image: mongo:8
    volumes:
      - bynder-mongo-data:/data/db
    restart: unless-stopped

  bango:
    build: ./projects/bango
    env_file:
      - ./projects/bango/.env
    environment:
      PORT: 5003
      MONGO_URI: mongodb://mongo-bango:27017/bango
      ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - '5003:5003'
    depends_on:
      mongo-bango:
        condition: service_started
    restart: unless-stopped

  mongo-bango:
    image: mongo:8
    volumes:
      - bango-mongo-data:/data/db
    restart: unless-stopped

volumes:
  print3d-hub-mongo-data:
  bynder-mongo-data:
  bynder-images:
  bango-mongo-data:
